<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Sprint 2 Burndown Current Through June 26, 2026</title>
  <desc id="desc">Burndown chart showing Sprint 2 story points decreasing from 31 to 2 remaining by June 26, 2026, with a linear ideal trend from June 15 through July 5.</desc>
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="90" y="54" fill="#172026" font-family="Arial, sans-serif" font-size="24" font-weight="700">Sprint 2 Burndown</text>
  <text x="90" y="82" fill="#52616b" font-family="Arial, sans-serif" font-size="14">Current through 2026-06-26. Jira Done-only remaining effort is 2 SP after SCRUM-10 merged.</text>

  <line x1="90" y1="410" x2="840" y2="410" stroke="#33434f" stroke-width="1.5"/>
  <line x1="90" y1="100" x2="90" y2="410" stroke="#33434f" stroke-width="1.5"/>

  <g fill="#52616b" font-family="Arial, sans-serif" font-size="12">
    <text x="54" y="414">0</text>
    <text x="48" y="364">5</text>
    <text x="42" y="314">10</text>
    <text x="42" y="264">15</text>
    <text x="42" y="214">20</text>
    <text x="42" y="164">25</text>
    <text x="42" y="104">31</text>
  </g>

  <g stroke="#d9e0e6" stroke-width="1">
    <line x1="90" y1="360" x2="840" y2="360"/>
    <line x1="90" y1="310" x2="840" y2="310"/>
    <line x1="90" y1="260" x2="840" y2="260"/>
    <line x1="90" y1="210" x2="840" y2="210"/>
    <line x1="90" y1="160" x2="840" y2="160"/>
    <line x1="90" y1="100" x2="840" y2="100"/>
  </g>

  <g fill="#52616b" font-family="Arial, sans-serif" font-size="12">
    <text x="74" y="438">Jun 15</text>
    <text x="187" y="438">Jun 18</text>
    <text x="300" y="438">Jun 21</text>
    <text x="412" y="438">Jun 24</text>
    <text x="525" y="438">Jun 27</text>
    <text x="637" y="438">Jun 30</text>
    <text x="750" y="438">Jul 3</text>
    <text x="824" y="438">Jul 5</text>
  </g>

  <text x="354" y="488" fill="#33434f" font-family="Arial, sans-serif" font-size="14" font-weight="700">Sprint Dates</text>
  <text transform="translate(24 318) rotate(-90)" fill="#33434f" font-family="Arial, sans-serif" font-size="14" font-weight="700">Story Points Remaining</text>

  <polyline fill="none" stroke="#8b949e" stroke-width="3" stroke-dasharray="8 7" points="90,100 840,410"/>
  <polyline fill="none" stroke="#1f7a6d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" points="90,100 165,150 240,210 315,240 390,270 465,320 502.5,390"/>

  <g fill="#1f7a6d" stroke="#ffffff" stroke-width="2">
    <circle cx="90" cy="100" r="5"/>
    <circle cx="165" cy="150" r="5"/>
    <circle cx="240" cy="210" r="5"/>
    <circle cx="315" cy="240" r="5"/>
    <circle cx="390" cy="270" r="5"/>
    <circle cx="465" cy="320" r="5"/>
    <circle cx="502.5" cy="390" r="5"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="12">
    <rect x="620" y="118" width="190" height="64" fill="#ffffff" stroke="#cad3dc"/>
    <line x1="638" y1="140" x2="688" y2="140" stroke="#1f7a6d" stroke-width="4"/>
    <text x="698" y="144" fill="#33434f">Actual remaining</text>
    <line x1="638" y1="164" x2="688" y2="164" stroke="#8b949e" stroke-width="3" stroke-dasharray="8 7"/>
    <text x="698" y="168" fill="#33434f">Ideal remaining</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="12" fill="#172026">
    <text x="514" y="392">2 SP remaining</text>
    <text x="514" y="408">29 Done, 2 To Do</text>
  </g>
</svg>
