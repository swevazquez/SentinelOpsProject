<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">Sprint 3 Week 9 Burndown</title>
  <description id="description">Sprint 3 local implementation reached zero remaining points on July 22. Formal Jira remaining effort reached zero on July 24 after all three story pull requests were reviewed and merged.</description>
  <rect width="1200" height="620" fill="#0b1118" rx="20"/>
  <text x="70" y="55" fill="#f3f7fb" font-family="Arial, sans-serif" font-size="28" font-weight="700">Sprint 3 Week 9 Burndown</text>
  <text x="70" y="85" fill="#9aabba" font-family="Arial, sans-serif" font-size="16">Formal Jira remaining effort through Sprint 3 completion</text>

  <g stroke="#293643" stroke-width="1">
    <line x1="100" y1="500" x2="1110" y2="500"/>
    <line x1="100" y1="430" x2="1110" y2="430"/>
    <line x1="100" y1="360" x2="1110" y2="360"/>
    <line x1="100" y1="290" x2="1110" y2="290"/>
    <line x1="100" y1="220" x2="1110" y2="220"/>
    <line x1="100" y1="150" x2="1110" y2="150"/>
  </g>

  <g fill="#9aabba" font-family="Arial, sans-serif" font-size="14" text-anchor="end">
    <text x="88" y="505">0</text>
    <text x="88" y="435">5</text>
    <text x="88" y="365">10</text>
    <text x="88" y="295">15</text>
    <text x="88" y="225">20</text>
    <text x="88" y="155">25</text>
  </g>
  <text x="28" y="325" fill="#9aabba" font-family="Arial, sans-serif" font-size="14" transform="rotate(-90 28 325)">Story points remaining</text>

  <g fill="#9aabba" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">
    <text x="120" y="535">Jul 6</text>
    <text x="330" y="535">Jul 12</text>
    <text x="480" y="535">Jul 13</text>
    <text x="650" y="535">Jul 17</text>
    <text x="800" y="535">Jul 18</text>
    <text x="960" y="535">Jul 22</text>
    <text x="1040" y="535">Jul 24</text>
    <text x="1090" y="535">Jul 26</text>
  </g>

  <polyline points="120,192 1090,500" fill="none" stroke="#647587" stroke-width="3" stroke-dasharray="10 8"/>
  <polyline points="120,192 330,318 480,388 650,318 800,388 960,388 1040,500" fill="none" stroke="#5fa8ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#5fa8ff" stroke="#dcecff" stroke-width="2">
    <circle cx="120" cy="192" r="7"/>
    <circle cx="330" cy="318" r="7"/>
    <circle cx="480" cy="388" r="7"/>
    <circle cx="650" cy="318" r="7"/>
    <circle cx="800" cy="388" r="7"/>
    <circle cx="960" cy="388" r="7"/>
    <circle cx="1040" cy="500" r="9"/>
  </g>

  <line x1="960" y1="388" x2="960" y2="500" stroke="#f3bd4d" stroke-width="4" stroke-dasharray="7 6"/>
  <circle cx="960" cy="500" r="9" fill="#f3bd4d" stroke="#fff1c7" stroke-width="2"/>
  <rect x="710" y="238" width="435" height="76" rx="10" fill="#302913" stroke="#f3bd4d"/>
  <text x="730" y="267" fill="#fff1c7" font-family="Arial, sans-serif" font-size="16" font-weight="700">8 SP locally implemented by Jul 22</text>
  <text x="730" y="293" fill="#d8c790" font-family="Arial, sans-serif" font-size="14">Reviewed, merged, and marked Done by Jul 24.</text>

  <g font-family="Arial, sans-serif" font-size="14">
    <line x1="110" y1="575" x2="155" y2="575" stroke="#5fa8ff" stroke-width="5"/>
    <text x="165" y="580" fill="#c8d4df">Formal remaining effort</text>
    <line x1="390" y1="575" x2="435" y2="575" stroke="#647587" stroke-width="3" stroke-dasharray="10 8"/>
    <text x="445" y="580" fill="#c8d4df">Ideal trend</text>
    <circle cx="650" cy="575" r="7" fill="#f3bd4d"/>
    <text x="665" y="580" fill="#c8d4df">Local implementation complete</text>
  </g>
</svg>
