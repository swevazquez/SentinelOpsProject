<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Sprint 3 Week 7 Burndown</title>
  <desc id="desc">Sprint 3 began with 22 story points. Nine points were completed by July 11, leaving 13.</desc>
  <rect width="900" height="420" fill="#ffffff"/>
  <g stroke="#d0d5dd" stroke-width="1">
    <line x1="80" y1="340" x2="850" y2="340"/><line x1="80" y1="270" x2="850" y2="270"/>
    <line x1="80" y1="200" x2="850" y2="200"/><line x1="80" y1="130" x2="850" y2="130"/>
    <line x1="80" y1="60" x2="850" y2="60"/>
  </g>
  <g fill="#475467" font-family="Arial, sans-serif" font-size="14">
    <text x="48" y="345">0</text><text x="40" y="275">6</text><text x="32" y="205">11</text>
    <text x="32" y="135">17</text><text x="32" y="65">22</text>
    <text x="70" y="375">Jul 6</text><text x="238" y="375">Jul 11</text><text x="820" y="375">Jul 26</text>
    <text x="80" y="30" font-size="20" font-weight="700" fill="#101828">Sprint 3 Remaining Effort</text>
  </g>
  <path d="M90 60 L840 340" fill="none" stroke="#98a2b3" stroke-width="3" stroke-dasharray="8 7"/>
  <path d="M90 60 L270 174" fill="none" stroke="#155eef" stroke-width="5"/>
  <circle cx="90" cy="60" r="7" fill="#155eef"/><circle cx="270" cy="174" r="7" fill="#155eef"/>
  <g font-family="Arial, sans-serif" font-size="14" font-weight="700">
    <text x="100" y="50" fill="#155eef">22 points</text><text x="280" y="164" fill="#155eef">13 remaining</text>
    <text x="650" y="315" fill="#667085">Ideal</text>
  </g>
</svg>
