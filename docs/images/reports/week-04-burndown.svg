<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Sprint 2 burndown as of June 21, 2026</title>
  <desc id="desc">Sprint 2 started with 31 story points. Four completed stories reduced remaining work to 17 story points by June 21.</desc>
  <rect width="900" height="500" fill="#ffffff"/>
  <text x="70" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17202a">Sprint 2 Burndown</text>
  <text x="70" y="68" font-family="Arial, sans-serif" font-size="14" fill="#566573">June 15-July 5, 2026 | Status as of June 21</text>

  <line x1="90" y1="410" x2="840" y2="410" stroke="#5d6d7e" stroke-width="2"/>
  <line x1="90" y1="100" x2="90" y2="410" stroke="#5d6d7e" stroke-width="2"/>

  <g font-family="Arial, sans-serif" font-size="13" fill="#566573">
    <text x="55" y="415">0</text>
    <text x="48" y="365">5</text>
    <text x="40" y="315">10</text>
    <text x="40" y="265">15</text>
    <text x="40" y="215">20</text>
    <text x="40" y="165">25</text>
    <text x="40" y="115">31</text>
    <text x="77" y="438">Jun 15</text>
    <text x="305" y="438">Jun 21</text>
    <text x="430" y="438">Jun 25</text>
    <text x="800" y="438">Jul 5</text>
  </g>

  <g stroke="#d5d8dc" stroke-width="1">
    <line x1="90" y1="360" x2="840" y2="360"/>
    <line x1="90" y1="310" x2="840" y2="310"/>
    <line x1="90" y1="260" x2="840" y2="260"/>
    <line x1="90" y1="210" x2="840" y2="210"/>
    <line x1="90" y1="160" x2="840" y2="160"/>
    <line x1="90" y1="100" x2="840" y2="100"/>
  </g>

  <line x1="90" y1="100" x2="840" y2="410" stroke="#7f8c8d" stroke-width="3" stroke-dasharray="9 7"/>
  <polyline points="90,100 165,150 240,210 315,240" fill="none" stroke="#1f618d" stroke-width="5"/>
  <circle cx="90" cy="100" r="6" fill="#1f618d"/>
  <circle cx="165" cy="150" r="6" fill="#1f618d"/>
  <circle cx="240" cy="210" r="6" fill="#1f618d"/>
  <circle cx="315" cy="240" r="7" fill="#1f618d"/>

  <rect x="565" y="94" width="250" height="82" fill="#f8f9f9" stroke="#ccd1d1"/>
  <line x1="585" y1="119" x2="625" y2="119" stroke="#7f8c8d" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="638" y="124" font-family="Arial, sans-serif" font-size="14" fill="#34495e">Ideal remaining</text>
  <line x1="585" y1="151" x2="625" y2="151" stroke="#1f618d" stroke-width="5"/>
  <text x="638" y="156" font-family="Arial, sans-serif" font-size="14" fill="#34495e">Actual remaining</text>

  <text x="332" y="230" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1f618d">17 SP remaining on Jun 21</text>
  <text x="90" y="475" font-family="Arial, sans-serif" font-size="13" fill="#566573">Completed: SCRUM-6, SCRUM-7, SCRUM-8, and SCRUM-18 (14 SP)</text>
</svg>
