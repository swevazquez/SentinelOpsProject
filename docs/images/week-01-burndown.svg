<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">Sprint 1 burndown chart through Week 1</title>
  <desc id="desc">Burndown chart showing 21 planned story points, 13 completed, and 8 remaining as of 2026-05-30.</desc>
  <rect width="920" height="520" fill="#ffffff"/>
  <text x="64" y="46" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937">Sprint 1 Burndown - Week 1</text>
  <text x="64" y="74" font-family="Arial, sans-serif" font-size="14" fill="#4b5563">Generated from Jira status after SCRUM-1, SCRUM-2, and SCRUM-3 were marked Done.</text>

  <line x1="92" y1="422" x2="830" y2="422" stroke="#111827" stroke-width="2"/>
  <line x1="92" y1="96" x2="92" y2="422" stroke="#111827" stroke-width="2"/>

  <g font-family="Arial, sans-serif" font-size="12" fill="#4b5563">
    <text x="58" y="426">0</text>
    <text x="52" y="349">5</text>
    <text x="46" y="271">10</text>
    <text x="46" y="194">15</text>
    <text x="46" y="116">20</text>
    <text x="82" y="454">May 25</text>
    <text x="386" y="454">May 30</text>
    <text x="792" y="454">Jun 15</text>
  </g>

  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="92" y1="345" x2="830" y2="345"/>
    <line x1="92" y1="267" x2="830" y2="267"/>
    <line x1="92" y1="190" x2="830" y2="190"/>
    <line x1="92" y1="112" x2="830" y2="112"/>
  </g>

  <polyline points="92,96 830,422" fill="none" stroke="#9ca3af" stroke-width="3" stroke-dasharray="8 8"/>
  <polyline points="92,96 420,298" fill="none" stroke="#2563eb" stroke-width="4"/>

  <circle cx="92" cy="96" r="5" fill="#2563eb"/>
  <circle cx="420" cy="298" r="5" fill="#2563eb"/>

  <g font-family="Arial, sans-serif" font-size="13">
    <rect x="626" y="104" width="184" height="78" rx="4" fill="#f9fafb" stroke="#d1d5db"/>
    <line x1="644" y1="128" x2="690" y2="128" stroke="#2563eb" stroke-width="4"/>
    <text x="700" y="132" fill="#1f2937">Actual remaining</text>
    <line x1="644" y1="158" x2="690" y2="158" stroke="#9ca3af" stroke-width="3" stroke-dasharray="8 8"/>
    <text x="700" y="162" fill="#1f2937">Ideal remaining</text>
  </g>

  <g font-family="Arial, sans-serif" fill="#1f2937">
    <text x="110" y="91" font-size="13">21 SP</text>
    <text x="438" y="303" font-size="13">8 SP remaining</text>
    <text x="380" y="326" font-size="13" fill="#4b5563">13 SP completed</text>
  </g>

  <text x="398" y="492" font-family="Arial, sans-serif" font-size="13" fill="#4b5563">Sprint timeline</text>
  <text x="20" y="265" transform="rotate(-90 20 265)" font-family="Arial, sans-serif" font-size="13" fill="#4b5563">Story points remaining</text>
</svg>
