name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify repository scaffold
        run: |
          test -f README.md
          test -f AGENTS.md
          test -f docker-compose.yml
          test -d services/api
          test -d services/agent
          test -d services/ml
          test -d services/spark-jobs
          test -d services/simulator
          test -d airflow/dags
          test -d frontend/dashboard
          test -d tests/unit
