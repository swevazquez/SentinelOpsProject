services:
  postgres:
    image: postgres:16
    container_name: sentinelops-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinelops}
      POSTGRES_USER: ${POSTGRES_USER:-sentinelops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinelops}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinelops} -d ${POSTGRES_DB:-sentinelops}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: sentinelops-api
    working_dir: /app
    env_file:
      - .env
    environment:
      SENTINELOPS_PERSISTENCE_BACKEND: postgres
      SENTINELOPS_WORKFLOW_BACKEND: airflow
      DATABASE_URL: postgresql://sentinelops:sentinelops@postgres:5432/sentinelops
      AIRFLOW_API_URL: http://airflow:8080/api/v1
      AIRFLOW_API_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-airflow}
      AIRFLOW_API_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-sentinelops}
      AIRFLOW_DAG_ID: sentinelops_predictive_maintenance
      AIRFLOW_REQUEST_TIMEOUT_SECONDS: 15
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      airflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  airflow-init:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    container_name: sentinelops-airflow-init
    env_file:
      - .env
    environment:
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://sentinelops:sentinelops@postgres:5432/sentinelops
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-airflow}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-sentinelops}
      SENTINELOPS_PERSISTENCE_BACKEND: postgres
      DATABASE_URL: postgresql://sentinelops:sentinelops@postgres:5432/sentinelops
      SENTINELOPS_PROJECT_ROOT: /app
    command: >-
      bash -c "airflow db migrate &&
      airflow users create
      --username \"$${AIRFLOW_ADMIN_USERNAME}\"
      --password \"$${AIRFLOW_ADMIN_PASSWORD}\"
      --firstname SentinelOps
      --lastname Reviewer
      --role Admin
      --email reviewer@sentinelops.local || true"
    volumes:
      - .:/app
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config:/opt/airflow/config
    depends_on:
      postgres:
        condition: service_healthy

  airflow:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    container_name: sentinelops-airflow
    env_file:
      - .env
    environment:
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://sentinelops:sentinelops@postgres:5432/sentinelops
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-airflow}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-sentinelops}
      SENTINELOPS_PERSISTENCE_BACKEND: postgres
      DATABASE_URL: postgresql://sentinelops:sentinelops@postgres:5432/sentinelops
      SENTINELOPS_PROJECT_ROOT: /app
    command: standalone
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config:/opt/airflow/config
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
