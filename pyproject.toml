[project]
name = "sentinelops"
version = "0.1.0"
description = "Graduate capstone MVP for predictive maintenance workflows."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "joblib>=1.4,<2.0",
    "numpy>=1.26,<2.5",
    "openai>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "scikit-learn>=1.6,<2.0",
    "uvicorn>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
